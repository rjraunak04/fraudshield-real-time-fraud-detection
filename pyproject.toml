[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield"
version = "0.1.0"
description = "Production-style real-time fraud detection and risk decision platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=3.0,<4.0",
    "prometheus-client>=0.21,<1.0",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "redis>=5.0,<7.0",
    "scikit-learn>=1.9,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "fastapi>=0.120,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]