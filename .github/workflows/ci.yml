name: FraudShield CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fraudshield-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e ".[dev]"

      - name: Verify package import
        run: python -c "import fraudshield; print('fraudshield import OK')"

      - name: Ruff
        run: ruff check .

      - name: Full test suite
        run: pytest -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build --tag fraudshield:ci .

      - name: Start container
        run: docker run --detach --name fraudshield-ci --publish 8000:8000 fraudshield:ci

      - name: Wait for healthy container
        shell: bash
        run: |
          for attempt in {1..20}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' fraudshield-ci 2>/dev/null || true)"
            echo "health=${status:-unknown} attempt=$attempt"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs fraudshield-ci
              exit 1
            fi
            sleep 3
          done
          docker logs fraudshield-ci
          exit 1

      - name: Verify liveness endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health

      - name: Verify unconfigured readiness is explicit
        shell: bash
        run: |
          code="$(curl --silent --output /tmp/readiness.json --write-out '%{http_code}' http://127.0.0.1:8000/ready/realtime)"
          cat /tmp/readiness.json
          test "$code" = "503"

      - name: Verify non-root runtime
        shell: bash
        run: |
          uid="$(docker exec fraudshield-ci id -u)"
          echo "container uid=$uid"
          test "$uid" != "0"

      - name: Container diagnostics
        if: always()
        run: |
          docker ps -a
          docker inspect fraudshield-ci || true
          docker logs fraudshield-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force fraudshield-ci || true
